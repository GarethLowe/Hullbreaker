name: verify

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck:hull
      - run: |
          for seed in 1729 7331 9001; do
            SELFCHECK_SEED=$seed npm test
          done
      - run: npm run build
      - run: |
          grep -F 'Content-Security-Policy' dist/index.html
          ! grep -F '<script type="importmap">' dist/index.html
      - run: npx playwright install --with-deps chromium
      - run: |
          npm run preview -- --host 127.0.0.1 &
          for i in {1..20}; do
            if curl --fail http://127.0.0.1:4174/; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - run: npm run test:smoke
